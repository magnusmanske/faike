[package]
name = "faike"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Watchdog for AI-generated media uploads on MediaWiki sites"

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = "0.8"
bytes = "1"
# Reference C2PA reader. `rust_native_crypto` avoids the OpenSSL build dependency.
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
infer = "0.22"
memchr = "2"
miniz_oxide = "0.8"
nom-exif = "3.8"
regex = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "query", "stream"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync", "net"] }
# ToolsDB pools, credentials and the matching mysql_async version.
toolforge = { version = "6.2", default-features = false, features = ["wikipool"], optional = true }
trustmark = { version = "0.4", optional = true }
# Metrics and health pushes for the bot and the web service.
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = ["logging", "telemetry"], optional = true }

[features]
default = ["trustmark", "toolsdb", "telemetry"]
trustmark = ["dep:trustmark"]
toolsdb = ["dep:toolforge"]
telemetry = ["dep:wikimisc"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
